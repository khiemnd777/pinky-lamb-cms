<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Các bước tạo Firebase project</title><desc id="desc">Đăng nhập Firebase Console, nhập tên, kiểm tra Project ID và tạo project.</desc>
  <rect width="1200" height="330" rx="22" fill="#f5f8fc"/><text x="42" y="54" fill="#213047" font-family="Arial,sans-serif" font-size="28" font-weight="700">Bước 1 · Tạo project thuộc Client</text>
  <g font-family="Arial,sans-serif">
    <rect x="42" y="88" width="1116" height="191" rx="18" fill="#fff" stroke="#d4dfeb" stroke-width="2"/>
    <rect x="67" y="113" width="250" height="140" rx="14" fill="#eaf3ff"/><text x="91" y="154" fill="#1e426c" font-size="19" font-weight="700">1. Đăng nhập</text><text x="91" y="187" fill="#3d5067" font-size="17">console.firebase.google.com</text><text x="91" y="214" fill="#3d5067" font-size="16">bằng Gmail Client</text>
    <text x="329" y="191" fill="#1976a3" font-size="28">→</text>
    <rect x="366" y="113" width="250" height="140" rx="14" fill="#eaf3ff"/><text x="390" y="154" fill="#1e426c" font-size="19" font-weight="700">2. Đặt tên</text><text x="390" y="187" fill="#3d5067" font-size="17">Pinky Lamb Production</text><text x="390" y="214" fill="#3d5067" font-size="16">là ví dụ minh họa</text>
    <text x="628" y="191" fill="#1976a3" font-size="28">→</text>
    <rect x="665" y="113" width="225" height="140" rx="14" fill="#eaf3ff"/><text x="689" y="154" fill="#1e426c" font-size="19" font-weight="700">3. Kiểm Project ID</text><text x="689" y="187" fill="#3d5067" font-size="16">Không đổi được sau</text><text x="689" y="214" fill="#3d5067" font-size="16">khi tạo project</text>
    <text x="902" y="191" fill="#1976a3" font-size="28">→</text>
    <rect x="939" y="113" width="194" height="140" rx="14" fill="#eaf3ff"/><text x="963" y="154" fill="#1e426c" font-size="19" font-weight="700">4. Tạo project</text><text x="963" y="187" fill="#3d5067" font-size="16">Kiểm tra trang</text><text x="963" y="214" fill="#3d5067" font-size="16">tổng quan</text>
  </g>
  <text x="42" y="310" fill="#65788e" font-family="Arial,sans-serif" font-size="14">Sơ đồ minh họa • không phải ảnh chụp giao diện</text>
</svg>
