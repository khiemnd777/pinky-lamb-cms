<!doctype html>
<html lang="vi">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' http://127.0.0.1:5010; style-src-attr 'unsafe-inline'; connect-src 'self' http://127.0.0.1:5010 http://127.0.0.1:9099 ws://127.0.0.1:5173; img-src 'self' http://127.0.0.1:5010 blob:; media-src blob:; font-src 'self' http://127.0.0.1:5010; frame-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
 <meta name="referrer" content="no-referrer">
 <title>Pinky Lamb — Quản trị nội dung</title>
 <link rel="stylesheet" href="/admin.css">
</head>
<body>
 <main class="admin-shell">
  <header class="admin-header"><div><p class="brand">PINKY LAMB</p><h1>Quản trị nội dung</h1></div><button id="logout" type="button" hidden>Đăng xuất</button></header>
  <section id="login-panel" class="card" aria-labelledby="login-title">
   <h2 id="login-title">Đăng nhập</h2><p>Sử dụng tài khoản được cấp quyền để quản lý nội dung.</p>
   <form id="login-form">
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
    <label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
    <button id="login-submit" type="submit">Đăng nhập</button>
   </form>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="session-panel" class="card" hidden><h2>Nội dung của bạn</h2><p>Quyền truy cập: <strong id="session-role"></strong></p><label for="cms-resource">Nội dung cần quản lý</label><select id="cms-resource"><option value="home">Hero và SEO</option><option value="home-v2">Toàn website</option><option value="home-v3">Toàn website — media</option><option value="media">Thư viện media</option></select><p id="session-ready">Bạn đã đăng nhập. Nội dung đang được chuẩn bị.</p><div id="private-content"></div><iframe id="preview" title="Xem trước nội dung" sandbox hidden></iframe></section>
 </main>
 <script type="module" src="/preview.mjs"></script>
 <script type="module" src="/auth.mjs"></script>
</body>
</html>
